name: Rebuild Published Briefings

on:
  push:
    branches: [main]
    paths:
      - "briefings/**"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build briefings.json from published files
        run: python scripts/build_briefings.py

      - name: Commit and push updated briefings.json
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add briefings.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Rebuild briefings.json"
            git push
          fi
