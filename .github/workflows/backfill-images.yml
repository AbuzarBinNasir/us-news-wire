name: Backfill Missing Images

on:
  workflow_dispatch: {}   # manual only — run this from the Actions tab whenever you like

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Backfill missing article images
        run: python scripts/backfill_images.py

      - name: Commit and push updated news.json
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add news.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Backfill missing article images"
            git push
          fi
